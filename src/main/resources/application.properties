spring.application.name=keepup

# 로컬 기본값은 compose.yaml과 같음. 다른 환경은 환경 변수로 덮어쓴다.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/keepup?serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:keepup}
spring.datasource.password=${DB_PASSWORD:keepup}

management.endpoints.web.exposure.include=health
