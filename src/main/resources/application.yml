spring:
  application:
    name: keepup
  # 로컬 기본값은 compose.yaml과 같음. 다른 환경은 환경 변수로 덮어쓴다.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/keepup?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:keepup}
    password: ${DB_PASSWORD:keepup}

management:
  endpoints:
    web:
      exposure:
        include: health

# p6spy: DataSource를 감싸 실행된 SQL(바인딩 값 포함)과 실행 시간을 한 줄로 남긴다
decorator:
  datasource:
    p6spy:
      log-format: "took %(executionTime)ms | %(category) | conn %(connectionId) | %(sqlSingleLine)"

# 스레드 이름과 requestId를 모든 로그 줄에 붙인다 (RequestLogFilter가 MDC에 넣음)
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{20} - %msg%n"
