services:
  mysql:
    image: mysql:8.4
    container_name: keepup-mysql
    environment:
      MYSQL_DATABASE: keepup
      MYSQL_USER: ${DB_USERNAME:-keepup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-keepup}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
